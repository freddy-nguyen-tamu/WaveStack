<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reader settings</title><style>body{font:16px system-ui,sans-serif;max-width:560px;margin:3rem auto;padding:1rem;background:#161616;color:#eee}input{width:100%}a{color:#9abfff}.card{border:1px solid #555;padding:1rem;border-radius:8px}</style><link rel="icon" href="./favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png"><link rel="apple-touch-icon" href="./favicon-180.png"></head><body><h1>Reader settings</h1><div class="card"><label for="speed">Automatic scrolling speed: <output id="number"></output> pixels per second</label><input id="speed" type="range" min="5" max="600" step="5"/><p><label><input id="auto" type="checkbox" style="width:auto"/> Automatically scroll through chapters</label></p><p>Reader shortcuts: Enter auto-scroll, ←/→ chapters, ↑/↓ scroll, F fullscreen, ? settings.</p><a id="back" href="./">Return to reader</a></div><script>const key='universal-comic-reader-v3';let s={};try{s=JSON.parse(localStorage.getItem(key)||'{}')}catch{}const speed=document.getElementById('speed'),n=document.getElementById('number'),a=document.getElementById('auto');speed.value=s.speed||80;a.checked=Boolean(s.auto);n.value=speed.value;const save=()=>{s.speed=+speed.value;s.auto=a.checked;localStorage.setItem(key,JSON.stringify(s));n.value=speed.value};speed.oninput=save;a.onchange=save;const b=new URL('./',location.href);if(s.lastChapter)b.searchParams.set('chapter',s.lastChapter);document.getElementById('back').href=b.toString();</script></body></html>
