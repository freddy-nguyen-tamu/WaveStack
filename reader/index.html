<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><title>Reader</title><link rel="stylesheet" href="./style.css"></head>
<body>
<main id="pages" role="main" aria-label="Comic pages"></main>
<div id="panel-backdrop" hidden></div>
<aside id="reader-panel" hidden role="dialog" aria-modal="true" aria-label="Reader navigation">
  <div class="panel-heading"><span id="panel-series"></span><button id="panel-close" type="button" aria-label="Close navigation">×</button></div>
  <div class="panel-controls">
    <label class="panel-label" for="panel-speed">Scroll speed <output id="panel-speed-text">80 px/s</output></label>
    <input id="panel-speed" type="range" min="5" max="600" step="5" aria-label="Scroll speed">
    <div class="panel-setting-row"><input id="panel-speed-number" type="number" min="5" max="1500" step="5" inputmode="numeric" aria-label="Pixels per second"><label class="panel-toggle"><input id="panel-auto" type="checkbox">Auto-scroll</label></div>
    <input id="panel-search" type="search" placeholder="Search chapters" aria-label="Search chapters" autocomplete="off">
  </div>
  <div id="panel-chapter-count" role="status"></div>
  <nav id="panel-chapters" aria-label="Chapters"></nav>
</aside>
<script type="module" src="./app.js"></script>
</body></html>
