<!doctype html><html><head><meta charset="utf-8"><title>Reader settings</title><style>body{font:16px sans-serif;max-width:500px;padding:20px}input[type=range]{width:100%}</style></head><body><h2>Clean comic reader settings</h2><label>Scroll speed: <span id="n"></span> px/sec<input id="speed" type="range" min="5" max="600" step="5"></label><p>Arrow keys: chapter and manual scrolling. Enter: toggle auto-scroll. Mouse-wheel events are never handled by the extension.</p><script>const k='cleanSourceComicReader.v3';chrome.storage.local.get([k],r=>{const s=r[k]||{};let e=document.querySelector('#speed'),n=document.querySelector('#n');e.value=s.speed||80;n.textContent=e.value;e.oninput=()=>{n.textContent=e.value;chrome.storage.local.set({[k]:{...s,speed:+e.value}})}});</script></body></html>
