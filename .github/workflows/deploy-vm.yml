name: Deploy to Oracle VM

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: wavestack-oracle-production
  cancel-in-progress: false

jobs:
  legacy_azure_deploy:
    name: Legacy Azure Deploy (skipped)
    if: ${{ false }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        run: |
          test -n "${{ secrets.VM_HOST }}" || { echo "Missing VM_HOST secret"; exit 1; }
          test -n "${{ secrets.VM_USER }}" || { echo "Missing VM_USER secret"; exit 1; }
          test -n "${{ secrets.VM_SSH_PRIVATE_KEY_B64 }}" || { echo "Missing VM_SSH_PRIVATE_KEY_B64 secret"; exit 1; }

      - name: Write SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_PRIVATE_KEY_B64 }}" | base64 -d > ~/.ssh/wavestack_deploy
          chmod 600 ~/.ssh/wavestack_deploy
          ssh-keygen -y -f ~/.ssh/wavestack_deploy > /dev/null

      - name: Add VM host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -T 30 -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts

      - name: Test SSH connection
        run: |
          ssh -i ~/.ssh/wavestack_deploy \
            "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" \
            "echo SSH connection works && whoami && hostname"

      - name: Upload source to VM
        run: |
          rsync -az --delete \
            --exclude ".git" \
            --exclude "node_modules" \
            --exclude "dist" \
            --exclude "build" \
            --exclude "coverage" \
            --exclude ".env" \
            --exclude "secrets" \
            --exclude "response.json" \
            --exclude "services/graphql-api/.cache" \
            -e "ssh -i ~/.ssh/wavestack_deploy" \
            ./ "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:/home/${{ secrets.VM_USER }}/WaveStack/"

      - name: Rebuild and restart containers
        run: |
          ssh -i ~/.ssh/wavestack_deploy "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" <<'REMOTE'
          set -e
          cd ~/WaveStack

          test -f .env || {
            echo "Missing ~/WaveStack/.env on VM"
            exit 1
          }

          # Inject Groq secrets into .env (if GitHub secret is set)
          if [ -n "${{ secrets.GROQ_API_KEY }}" ]; then sed -i '/^GROQ_API_KEY=/d' .env; echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY}}" >> .env; fi
          if [ -n "${{ secrets.GROQ_API_KEY1 }}" ]; then sed -i '/^GROQ_API_KEY1=/d' .env; echo "GROQ_API_KEY1=${{ secrets.GROQ_API_KEY1}}" >> .env; fi
          if [ -n "${{ secrets.GROQ_API_KEY2 }}" ]; then sed -i '/^GROQ_API_KEY2=/d' .env; echo "GROQ_API_KEY2=${{ secrets.GROQ_API_KEY2}}" >> .env; fi
          if [ -n "${{ secrets.GROQ_API_KEY3 }}" ]; then sed -i '/^GROQ_API_KEY3=/d' .env; echo "GROQ_API_KEY3=${{ secrets.GROQ_API_KEY3}}" >> .env; fi
          if [ -n "${{ secrets.GROQ_API_KEY4 }}" ]; then sed -i '/^GROQ_API_KEY4=/d' .env; echo "GROQ_API_KEY4=${{ secrets.GROQ_API_KEY4}}" >> .env; fi
          if [ -n "${{ secrets.GROQ_API_KEY5 }}" ]; then sed -i '/^GROQ_API_KEY5=/d' .env; echo "GROQ_API_KEY5=${{ secrets.GROQ_API_KEY5}}" >> .env; fi
          if [ -n "${{ secrets.GROQ_API_KEY6 }}" ]; then sed -i '/^GROQ_API_KEY6=/d' .env; echo "GROQ_API_KEY6=${{ secrets.GROQ_API_KEY6}}" >> .env; fi
          if [ -n "${{ secrets.GROQ_API_KEY7 }}" ]; then sed -i '/^GROQ_API_KEY7=/d' .env; echo "GROQ_API_KEY7=${{ secrets.GROQ_API_KEY7}}" >> .env; fi
          if [ -n "${{ secrets.GROQ_API_KEY8 }}" ]; then sed -i '/^GROQ_API_KEY8=/d' .env; echo "GROQ_API_KEY8=${{ secrets.GROQ_API_KEY8}}" >> .env; fi
          if [ -n "${{ secrets.GROQ_API_KEY9 }}" ]; then sed -i '/^GROQ_API_KEY9=/d' .env; echo "GROQ_API_KEY9=${{ secrets.GROQ_API_KEY9}}" >> .env; fi
          if [ -n "${{ secrets.GROQ_MODEL }}" ]; then sed -i '/^GROQ_MODEL=/d' .env; echo "GROQ_MODEL=${{ secrets.GROQ_MODEL}}" >> .env; fi

          sudo docker compose config >/dev/null
          sudo docker compose up --build -d
          sudo docker compose ps
          REMOTE

  deploy_oracle:
    name: Deploy Oracle
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Oracle deployment secrets
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_VM_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_VM_USER }}
          ORACLE_KEY_B64: ${{ secrets.ORACLE_VM_SSH_PRIVATE_KEY_B64 }}
        run: |
          test -n "$ORACLE_HOST" || {
            echo "Missing ORACLE_VM_HOST secret"
            exit 1
          }

          test -n "$ORACLE_USER" || {
            echo "Missing ORACLE_VM_USER secret"
            exit 1
          }

          test -n "$ORACLE_KEY_B64" || {
            echo "Missing ORACLE_VM_SSH_PRIVATE_KEY_B64 secret"
            exit 1
          }

      - name: Write Oracle SSH key
        env:
          ORACLE_KEY_B64: ${{ secrets.ORACLE_VM_SSH_PRIVATE_KEY_B64 }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$ORACLE_KEY_B64" |
            base64 -d > ~/.ssh/wavestack_oracle_actions

          chmod 600 ~/.ssh/wavestack_oracle_actions

          ssh-keygen -y \
            -f ~/.ssh/wavestack_oracle_actions \
            > /dev/null

      - name: Add Oracle host key
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_VM_HOST }}
        run: |
          mkdir -p ~/.ssh

          ssh-keyscan \
            -T 30 \
            -H "$ORACLE_HOST" \
            >> ~/.ssh/known_hosts

      - name: Test Oracle SSH connection
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_VM_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_VM_USER }}
        run: |
          ssh \
            -i ~/.ssh/wavestack_oracle_actions \
            "$ORACLE_USER@$ORACLE_HOST" \
            "echo 'Oracle SSH works' && whoami && hostname"

      - name: Upload source to Oracle
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_VM_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_VM_USER }}
        run: |
          rsync -az --delete \
            --exclude ".git" \
            --exclude "node_modules" \
            --exclude "dist" \
            --exclude "build" \
            --exclude "coverage" \
            --exclude ".env" \
            --exclude "secrets" \
            --exclude "response.json" \
            --exclude "services/graphql-api/.cache" \
            -e "ssh -i ~/.ssh/wavestack_oracle_actions" \
            ./ \
            "$ORACLE_USER@$ORACLE_HOST:/home/$ORACLE_USER/WaveStack/"

      - name: Rebuild and restart Oracle containers
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_VM_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_VM_USER }}
        run: |
          ssh \
            -i ~/.ssh/wavestack_oracle_actions \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            "$ORACLE_USER@$ORACLE_HOST" <<'REMOTE'
          set -euo pipefail

          cd ~/WaveStack

          test -f .env || {
            echo "Missing ~/WaveStack/.env on Oracle"
            exit 1
          }

          sudo docker compose config >/dev/null

          # Finish all builds before replacing any running service.
          sudo docker compose build

          # A failed recreation can leave containers in Created state; reconcile once.
          if ! sudo docker compose up --no-build -d; then
            sudo docker compose ps -a
            sleep 5
            sudo docker compose up --no-build -d
          fi

          ready=false
          for attempt in $(seq 1 30); do
            if sudo docker compose exec -T graphql-api node -e '
              fetch("http://localhost:3000/graphql", {
                method: "POST",
                headers: { "content-type": "application/json" },
                body: JSON.stringify({ query: "{ __typename }" }),
                signal: AbortSignal.timeout(5000)
              }).then(async response => {
                const body = await response.json();
                if (!response.ok || body.data?.__typename !== "Query") process.exit(1);
              }).catch(() => process.exit(1));
            ' && curl --fail --silent --max-time 5 http://localhost:5173/ >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            sudo docker compose ps -a
            sudo docker compose logs --tail=80 graphql-api frontend
            exit 1
          fi

          printf '%s\n' "Oracle deployment activated successfully at $(date -Is)" \
            > .oracle-deploy-ready

          sudo docker compose ps
          REMOTE

      - name: Verify public API and browser CORS
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_VM_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_VM_USER }}
        run: |
          set -euo pipefail

          # The internal service may be healthy while Caddy still returns 502.
          # Validate from the external Actions runner, just like a real browser.
          response_file="$(mktemp)"
          header_file="$(mktemp)"
          trap 'rm -f "$response_file" "$header_file"' EXIT
          healthy=false

          for attempt in $(seq 1 12); do
            status="$(curl --silent --show-error --max-time 10 \
              --output "$response_file" --write-out '%{http_code}' \
              -H 'Origin: https://wavestack.duckdns.org' \
              -H 'Content-Type: application/json' \
              --data '{"query":"{ __typename }"}' \
              https://api.wavestack.duckdns.org/graphql)" || status="000"

            if [ "$status" = "200" ] && node -e '
              const fs = require("node:fs");
              try {
                const payload = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
                process.exit(payload.data?.__typename === "Query" ? 0 : 1);
              } catch { process.exit(1); }
            ' "$response_file"; then
              preflight_status="$(curl --silent --show-error --max-time 10 \
                --dump-header "$header_file" --output /dev/null \
                --write-out '%{http_code}' --request OPTIONS \
                -H 'Origin: https://wavestack.duckdns.org' \
                -H 'Access-Control-Request-Method: POST' \
                -H 'Access-Control-Request-Headers: content-type' \
                https://api.wavestack.duckdns.org/graphql)" || preflight_status="000"
              if [[ "$preflight_status" =~ ^2[0-9][0-9]$ ]] && \
                 tr -d '\r' < "$header_file" | grep -Eiq '^access-control-allow-origin:[[:space:]]*(\*|https://wavestack\.duckdns\.org)[[:space:]]*$'; then
                healthy=true
                break
              fi
              echo "Public CORS preflight failed (HTTP $preflight_status), attempt $attempt/12"
            else
              echo "Public GraphQL check failed (HTTP $status), attempt $attempt/12"
            fi
            sleep 5
          done

          if [ "$healthy" != true ]; then
            echo "ERROR: public API is not reachable or fails CORS despite the internal deployment checks."
            echo "=== Oracle service and upstream diagnostics ==="
            ssh -i ~/.ssh/wavestack_oracle_actions \
              -o BatchMode=yes -o ConnectTimeout=15 \
              "$ORACLE_USER@$ORACLE_HOST" <<'REMOTE' || true
          set -eu
          cd ~/WaveStack
          sudo docker compose ps -a
          sudo docker compose logs --tail=70 graphql-api postgres
          echo '=== Active reverse proxies and Docker networks ==='
          sudo docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}'
          sudo docker inspect -f '{{.Name}} {{range $name, $_ := .NetworkSettings.Networks}}{{$name}} {{end}}' \
            "$(sudo docker compose ps -q graphql-api)" 2>/dev/null || true
          REMOTE
            exit 1
          fi

          echo 'Public GraphQL, upstream routing, and browser CORS all healthy.'

      - name: Remove deployment key
        if: always()
        run: |
          rm -f ~/.ssh/wavestack_oracle_actions
